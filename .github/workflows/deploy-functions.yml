# Deploys the Supabase edge functions whenever they change on main.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase > Account > Access Tokens).
# Without it the job only warns; the function can also be deployed from the Supabase dashboard.
# The functions' own secrets (ANTHROPIC_API_KEY, SERPAPI_KEY, ADZUNA_APP_ID, ADZUNA_APP_KEY, RESEND_API_KEY) lives in Supabase > Edge Functions > Secrets, never in this repo.
name: Deploy Supabase functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-functions.yml']
  workflow_dispatch:
concurrency:
  group: supabase-functions
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zixdctuwmdnsayzjwmpd
    steps:
      - uses: actions/checkout@v4
      - name: Check the access token is set
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set, so functions were not deployed (see README)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      # The function checks the caller's sign-in itself, so the gateway's JWT check is off.
      - if: steps.token.outputs.ok == 'true'
        run: supabase functions deploy process-document --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      # daily-search is called by pg_cron without a key; it only runs people who are due (see the function).
      - if: steps.token.outputs.ok == 'true'
        run: supabase functions deploy daily-search --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
